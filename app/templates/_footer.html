<!-- Footer (matches base44 Footer.jsx) -->
<style>
    .footer { position: relative; margin-top: 96px; border-top: 1px solid hsla(40, 10%, 88%, 0.3); }
    .footer-trigger {
        padding: 64px 16px;
        display: flex; flex-direction: column; align-items: center;
        cursor: pointer; user-select: none;
    }
    @media (min-width: 640px) { .footer-trigger { padding: 96px 32px; } }
    .footer-sahara {
        font-family: var(--font-heading);
        font-size: clamp(48px, 14vw, 144px);
        letter-spacing: var(--tracking-sahara);
        font-weight: 400;
        color: hsla(0, 0%, 10%, 0.10);
        transition: color .7s ease;
        white-space: nowrap;
        padding-left: var(--tracking-sahara);
    }
    .footer-trigger:hover .footer-sahara { color: hsla(0, 0%, 10%, 0.20); }
    .footer-hint {
        margin-top: 16px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: var(--tracking-wide-xl);
        color: hsl(var(--muted-foreground));
    }
    .footer-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height .5s ease;
    }
    .footer-content.open { max-height: 1000px; }
    .footer-grid {
        max-width: var(--container);
        margin: 0 auto;
        padding: 0 16px 64px;
        display: grid; grid-template-columns: 1fr;
        gap: 48px;
    }
    @media (min-width: 640px) { .footer-grid { padding: 0 32px 64px; grid-template-columns: 1fr 1fr; } }
    @media (min-width: 1024px) { .footer-grid { padding: 0 48px 64px; grid-template-columns: repeat(4, 1fr); } }
    .footer-col h4 {
        font-family: var(--font-body);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: var(--tracking-wide-xl);
        color: hsl(var(--muted-foreground));
        font-weight: 500;
        margin-bottom: 24px;
    }
    .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .footer-col li, .footer-col a {
        font-size: 14px;
        font-weight: 300;
        transition: color .3s;
    }
    .footer-col a:hover { color: hsl(var(--gold)); }
    .footer-socials { display: flex; gap: 16px; }
    .footer-socials a { transition: color .3s; }
    .footer-socials a:hover { color: hsl(var(--gold)); }
    .footer-socials svg {
        width: 18px; height: 18px;
        stroke: currentColor; fill: none; stroke-width: 1.5;
        stroke-linecap: round; stroke-linejoin: round;
    }
    .footer-bottom {
        border-top: 1px solid hsla(40, 10%, 88%, 0.3);
        padding: 24px;
        text-align: center;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: var(--tracking-wide-xl);
        color: hsl(var(--muted-foreground));
    }
</style>

<footer class="footer">
    <div class="footer-trigger" id="footerTrigger">
        <div class="footer-sahara">SAHARA</div>
        <p class="footer-hint" id="footerHint">Натисніть для контактів</p>
    </div>
    <div class="footer-content" id="footerContent">
        <div class="footer-grid">
            <div class="footer-col">
                <h4>Навігація</h4>
                <ul>
                    <li><a href="/">Головна</a></li>
                    <li><a href="/catalog">Каталог</a></li>
                    <li><a href="/about">Про нас</a></li>
                    <li><a href="/support">Підтримка</a></li>
                </ul>
            </div>
            <div class="footer-col">
                <h4>Категорії</h4>
                <ul>
                    <li><a href="/catalog?category=women">Жіночий одяг</a></li>
                    <li><a href="/catalog?category=men">Чоловічий одяг</a></li>
                </ul>
            </div>
            <div class="footer-col">
                <h4>Контакти</h4>
                <ul>
                    <li>info@sahara.ua</li>
                    <li>+380 (44) 123-45-67</li>
                    <li>Київ, Україна</li>
                </ul>
            </div>
            <div class="footer-col">
                <h4>Соціальні мережі</h4>
                <div class="footer-socials">
                    <a href="#" aria-label="Instagram">
                        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
                    </a>
                    <a href="#" aria-label="Facebook">
                        <svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
                    </a>
                    <a href="mailto:info@sahara.ua" aria-label="Email">
                        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <div class="footer-bottom">© 2026 SAHARA. Усі права захищені.</div>
</footer>

<script>
    (function() {
        const trigger = document.getElementById('footerTrigger');
        const content = document.getElementById('footerContent');
        const hint = document.getElementById('footerHint');
        trigger?.addEventListener('click', () => {
            const isOpen = content.classList.toggle('open');
            hint.textContent = isOpen ? 'Натисніть, щоб згорнути' : 'Натисніть для контактів';
        });
    })();
</script>
